name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate workflow bundle and documentation
        run: python3 scripts/check_workflow.py
      - name: Check shell template syntax
        run: |
          bash -n .agents/skills/wizard/template.sh
          bash -n .agents/skills/diagnosing-bugs/scripts/hitl-loop.template.sh
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and build extension
        run: |
          npm ci
          npm run build
      - name: Install Chromium for extension tests
        run: npx playwright install --with-deps --no-shell chromium
      - name: Run browser end-to-end tests
        run: npm test
      - name: Archive corresponding source
        run: git archive --format=zip --prefix=yoread-source/ -o dist/yoread-source.zip HEAD
      - name: Upload the tested extension
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yoread-chrome-trial
          path: |
            dist/extension/
            dist/yoread-source.zip
          if-no-files-found: error
