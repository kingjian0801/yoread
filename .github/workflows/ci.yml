name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run test:unit

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm run test:integration

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-24.04
    container:
      # Update this image and digest with @playwright/test in package-lock.json.
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --ipc=host
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Validate workflow bundle and documentation
        run: python3 scripts/check_workflow.py
      - name: Check shell template syntax
        run: |
          bash -n .agents/skills/wizard/template.sh
          bash -n .agents/skills/diagnosing-bugs/scripts/hitl-loop.template.sh
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies and build extension
        run: |
          npm ci
          npm run build
      - name: Run browser end-to-end tests
        run: npm test
      - name: Archive corresponding source
        # The hosted runner owns the mounted checkout outside the container.
        run: git -c safe.directory="$GITHUB_WORKSPACE" archive --format=zip --prefix=yoread-source/ -o dist/yoread-source.zip HEAD
      - name: Upload the tested extension
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yoread-chrome-trial
          path: |
            dist/extension/
            dist/yoread-source.zip
          if-no-files-found: error
          overwrite: true

  repository-checks:
    name: Repository checks
    needs: [unit-tests, integration-tests, browser-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Require successful results from all three suites
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_RESULT: ${{ needs.integration-tests.result }}
          BROWSER_RESULT: ${{ needs.browser-e2e.result }}
        run: |
          printf 'Unit: %s\nIntegration: %s\nBrowser E2E: %s\n' "$UNIT_RESULT" "$INTEGRATION_RESULT" "$BROWSER_RESULT"
          test "$UNIT_RESULT" = success &&
            test "$INTEGRATION_RESULT" = success &&
            test "$BROWSER_RESULT" = success

  deploy:
    name: Deploy to production
    needs: repository-checks
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: [self-hosted, Linux, X64, yoread-production]
    timeout-minutes: 5
    environment: production
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Install this run's tested artifact
        env:
          ACTIONS_READ_TOKEN: ${{ github.token }}
        run: |
          bundle=$(mktemp)
          trap 'rm -f "$bundle"' EXIT
          artifacts="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=yoread-chrome-trial"
          artifact_id=$(curl -fsS --max-time 20 -H "Authorization: Bearer $ACTIONS_READ_TOKEN" "$artifacts" |
            jq -er '.artifacts | select(length == 1) | .[0] | select(.expired | not) | .id')
          curl -fsSL --max-time 60 --max-filesize 33554432 -H "Authorization: Bearer $ACTIONS_READ_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" -o "$bundle"
          identity=$(curl -fsS --max-time 20 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=yoread-production" | jq -er .value)
          { printf '%s\n' "$identity"; cat "$bundle"; } | sudo -n /usr/local/sbin/yoread-publish
