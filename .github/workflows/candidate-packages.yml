name: Candidate packages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read

jobs:
  package:
    name: Archive four browser candidates
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id &&
      (github.event.workflow_run.event == 'pull_request' ||
        (github.event.workflow_run.head_branch == 'main' &&
          (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')))
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out the completed CI run's source revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Build and check the candidate archives
        env:
          CANDIDATE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_REVISION"
          xcrun --find safari-web-extension-packager
          node scripts/package-release.mjs dist/candidate
          (cd dist/candidate && shasum -a 256 -c SHA256SUMS)
      - name: Upload the audited candidate files
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: yoread-candidate-${{ github.event.workflow_run.head_sha }}
          path: dist/candidate/
          if-no-files-found: error
          compression-level: 0
