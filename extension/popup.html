<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Yoread</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <main>
      <header class="masthead">
        <h1>Yoread</h1>
        <p class="language">英文 <span aria-hidden="true">→</span><span class="sr-only">译为</span> 简体中文</p>
      </header>

      <section class="translation" aria-labelledby="translation-title">
        <h2 id="translation-title">当前网页</h2>
        <p id="page-status" role="status" data-state="idle" tabindex="-1">打开网页后即可手动翻译。</p>
        <progress id="translation-progress" aria-label="正文翻译进度" aria-describedby="page-status" hidden></progress>
        <div id="page-actions" class="button-row">
          <button type="button" id="translate" class="primary" disabled>翻译此页</button>
          <button type="button" id="restore" disabled>恢复原文</button>
        </div>
        <section id="consent" class="consent" aria-labelledby="consent-title" hidden>
          <h3 id="consent-title">确认发送正文</h3>
          <p>将当前页面可翻译的正文发送至 DeepSeek。该确认仅对当前页面有效。</p>
          <div class="button-row">
            <button id="confirm" class="primary" type="button">确认并翻译</button>
            <button id="dismiss" type="button">取消</button>
          </div>
        </section>
      </section>

      <details id="key-settings" open>
        <summary>
          <span>DeepSeek 设置</span>
          <span id="key-state" class="setting-state" role="status">未配置</span>
        </summary>
        <form id="key-form" autocomplete="off">
          <label for="key">DeepSeek API Key</label>
          <div class="key-row">
            <input id="key" type="password" spellcheck="false" autocomplete="off"
              autocapitalize="none" placeholder="粘贴你的 API Key" aria-describedby="key-note">
            <button type="submit" id="save-key">保存</button>
          </div>
          <p id="key-note" class="hint">Key 保存在此浏览器。连接测试使用固定短文本。</p>
          <div class="button-row small">
            <button type="button" id="test-key" disabled>测试连接</button>
            <button type="button" id="clear-key" disabled>清除 Key</button>
          </div>
          <p id="settings-status" role="status" class="feedback" hidden></p>
        </form>
      </details>

      <section class="github" aria-labelledby="github-label">
        <label for="github">
          <span id="github-label">GitHub 界面汉化</span>
          <span class="hint">本地词库，独立于网页正文翻译。</span>
        </label>
        <input id="github" type="checkbox" role="switch" aria-labelledby="github-label" disabled>
        <p id="github-status" role="status" class="feedback" hidden></p>
      </section>
    </main>
  </body>
</html>
